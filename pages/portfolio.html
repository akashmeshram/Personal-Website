---
layout: default
title: Akash Meshram | Portfolio 
permalink: /portfolio
---

<main id="portfolio-page">
		{% for item in site.data.projects %}
			<article>
				<a 
					{% if item.slug %} 
						href="{{ item.slug }}"
					{% else %}
						href="{{ item.link }}"
						target="_blank"
					{% endif %}
				>
					<div class="work-thumbnail">
							<img
								{% if item.image %} 
									src="{{ item.image }}"
								{% else %}
									src="/assets/portfolio/{{ item.slug }}.webp"
								{% endif %}
							>
					</div>
					<small class="work-header">
						{{ item.name }} 
					</small>
					<p>
						{{ item.desc }}
					</p>
				</a>
			</article>
		{% endfor %}
</main>
