---
layout: default
---

<section class="page-content" id="project-page">
	<div>
		<h2>{{ page.title }}</h2>
		<p class="lead">{{ page.tech }}</p>
	</div>

	<div>
		{% if page.gif != null %}
			<img src="{{ page.gif }}" />
		{% endif %}
	</div>
	

	<div>
		{% if page.launch != null %}
			<a href="{{ page.launch }}" target="_blank">
				<button>LAUNCH</button> 
			</a>
		{% endif %}
		{% if page.source != null %}
			<a href="{{ page.source }}" target="_blank">
				<button>GET CODE</button>
			</a>
		{% endif %}
	</div>

	<div>
		{{ content }}
	</div>
</section>
