{% assign tags = item.tech_stack | split: ", " %}

<article >
  <h4 class="work-title">{{ item.company }}</h4>
  <div class="work-item">
    <div>
      <p class="work-position">{{ item.position }}</p>
      <p>{{ item.start_date }} - {{ item.end_date }}</p>
      <p>{{ item.description }}</p>
      <div>
        {% for tag in tags %}
        <small>{{ tag }}</small>
        {% endfor %}
      </div>
    </div>  
  {% if item.slug != null or item.image != null %}
    <div>
      <img
            {% if item.image %} 
              src="{{ item.image }}"
            {% else %}
              src="/assets/work/{{item.slug }}.webp"
            {% endif %}
          >
    </div>
  {% endif %}
  </div>

</article>
