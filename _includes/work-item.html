<article class="work-item">
  <div>
    <h4>{{ item.company }}</h4>
    <p class="work-position">{{ item.position }}</p>
    <p>{{ item.start_date }} - {{ item.end_date }}</p>
    <p>{{ item.description }}</p>
  </div>  
{% if item.slug != null or item.image != null %}
  <div>
    <img
          {% if item.image %} 
            src="{{ item.image }}"
          {% else %}
            src="/assets/work/{{item.slug }}.webp"
          {% endif %}
        >
  </div>
{% endif %}
</article>
