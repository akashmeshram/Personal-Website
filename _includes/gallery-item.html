<article>
  <a 
    {% if item.page %} 
      href="{{ item.page }}"
      target="_blank"
    {% else %}
      href="{{include.path}}/{{ item.slug }}"
    {% endif %}
  >
    <div class="gallery-thumbnail">
        <img
          {% if item.image %} 
            src="{{ item.image }}"
          {% else %}
            src="/assets{{include.path}}/{{ item.slug }}.webp"
          {% endif %}
        >
    </div>
    <p class="gallery-header">
      {{ item.name }} 
    </p>
    <p>
      {{ item.desc }}
    </p>
  </a>
</article>
