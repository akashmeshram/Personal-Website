<header>
    <div>
        <span id="logo">  
            <a href="/"> 
                Akash Meshram 
            </a> 
        </span>

        <span id="toggle">
            {% include bars.svg %}
        </span>
    </div>
    

    <nav>
        {% for item in site.data.navigation %}
            <span
                {% if page.url == item.link %}
                    id="active-page" 
                {% endif %}
            >
                <a href="{{ item.link }}"> {{ item.name }} </a>
            </span>
        {% endfor %}
    </nav>
    
</header>
