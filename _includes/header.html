<header>
    <div>
        <span id="logo">  
            <a href="/"> 
                Akash Meshram 
            </a> 
        </span>

        <span id="navbar-toggle">
            <i class="fas fa-bars"></i>
        </span>
    </div>
    

    <nav id="menu">
        {% for item in site.data.navigation %}
            <span
                {% if page.url == item.link %}
                    style="color: rgb(255, 132, 0);" 
                {% endif %}
            >
                <a href="{{ item.link }}"> {{ item.name }} </a>
            </span>
        {% endfor %}
    </nav>
    
</header>
